# Full AnalystOS stack (ADR-0003). `docker compose up -d` boots infrastructure + app.
# Infra only:  docker compose up -d postgres redis temporal superset servicenow-mock
# Optional Neo4j graph projection: `docker compose --profile graph up -d neo4j` + ANALYSTOS_GRAPH_ENABLED=true.
# Optional PgBouncer (transaction pooling) in front of Postgres for the control/analytics planes:
#   ANALYSTOS_PG_POOLER=pgbouncer:5432 ANALYSTOS_DB_TRANSACTION_POOLER=true docker compose --profile pooled up -d
# (docs/30-runbooks/02-operations.md "Connection pooling"). The builder URL always stays direct.
# Worker pools (one per Temporal task queue) scale independently, e.g.
#   docker compose up -d --scale worker-compute=4 --scale worker-analysis=2
name: analystos

x-app-env: &app-env
  ANALYSTOS_DATABASE_URL: postgresql+psycopg://analystos:analystos@${ANALYSTOS_PG_POOLER:-postgres:5432}/analystos
  ANALYSTOS_ANALYTICS_LOADER_URL: postgresql+psycopg://analystos_loader:loader@${ANALYSTOS_PG_POOLER:-postgres:5432}/analytics
  ANALYSTOS_ANALYTICS_READER_URL: postgresql+psycopg://analystos_reader:reader@${ANALYSTOS_PG_POOLER:-postgres:5432}/analytics
  # dbt keeps its role for the whole session: never through a transaction-mode pooler.
  ANALYSTOS_ANALYTICS_BUILDER_URL: postgresql+psycopg://analystos_builder:builder@postgres:5432/analytics
  # true when the URLs above go through PgBouncer in transaction mode (no server-side prepared statements).
  ANALYSTOS_DB_TRANSACTION_POOLER: ${ANALYSTOS_DB_TRANSACTION_POOLER:-false}
  ANALYSTOS_REDIS_URL: redis://redis:6379/0
  ANALYSTOS_NEO4J_URI: bolt://neo4j:7687
  # Neo4j is an optional projection (off by default); start it with `--profile graph` and set this to true.
  ANALYSTOS_GRAPH_ENABLED: ${ANALYSTOS_GRAPH_ENABLED:-false}
  ANALYSTOS_TEMPORAL_ADDRESS: temporal:7233
  ANALYSTOS_SUPERSET_URL: http://superset:8088
  ANALYSTOS_SUPERSET_PUBLIC_URL: http://localhost:8088
  ANALYSTOS_SERVICENOW_MOCK_URL: http://servicenow-mock:8090
  # Development credential for the bundled synthetic ServiceNow source.
  SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD:-admin}
  ANALYSTOS_JWT_SECRET: ${ANALYSTOS_JWT_SECRET:-dev-only-change-me-please-32bytes!!}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Python sandbox isolation (P4-02). These containers have no Docker socket and, under Docker's default
  # seccomp profile, cannot create namespaces: the sandbox is refused here (fail closed; /api/health
  # checks.sandbox). Run the worker on the host for `process`/`container` isolation, or set `off` (dev only).
  ANALYSTOS_SANDBOX_ISOLATION: ${ANALYSTOS_SANDBOX_ISOLATION:-auto}

services:
  postgres:
    image: pgvector/pgvector:pg16
    # API, workers (one pool per queue), scheduler and Superset each keep a pool; 100 runs out.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: analystos
      POSTGRES_PASSWORD: analystos
      POSTGRES_DB: analystos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analystos -d analystos"]
      interval: 5s
      retries: 20

  # Transaction-mode pooler (spec v3 §8), off by default: `--profile pooled`. Clients may open up to
  # MAX_CLIENT_CONN; Postgres sees at most DEFAULT_POOL_SIZE per (database, user) and
  # MAX_DB_CONNECTIONS per database. Logins are checked against pg_shadow through auth_query, so the
  # per-workspace and per-plane roles need no userlist entries.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    profiles: ["pooled"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_HOST: postgres
      DB_USER: analystos
      DB_PASSWORD: analystos
      AUTH_TYPE: scram-sha-256
      AUTH_USER: analystos
      AUTH_DBNAME: postgres
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$$1
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-30}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-40}
      MAX_PREPARED_STATEMENTS: "0"
      # A client waiting longer than this for a server connection gets an error (and the activity a
      # retry) instead of waiting forever; see the nested-transaction note in the runbook.
      QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-60}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      ADMIN_USERS: analystos
      STATS_USERS: analystos
    ports: ["6432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U analystos -d postgres || exit 1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/analystos-neo4j
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.25
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: analystos
      POSTGRES_PWD: analystos
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  superset:
    image: analystos-superset:4.1.1
    build: {context: ./deploy/superset, dockerfile: Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SUPERSET_CONFIG_PATH: /app/analystos/superset_config.py
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: admin
    volumes: [./deploy/superset:/app/analystos:ro]
    entrypoint: ["/app/analystos/bootstrap.sh"]
    ports: ["8088:8088"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 40

  servicenow-mock:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    command: ["uvicorn", "analystos.connectors.servicenow_mock:app", "--host", "0.0.0.0", "--port", "8090"]
    ports: ["8090:8090"]

  api:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["sh", "-c", "analystos migrate && analystos seed && uvicorn analystos.api.app:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/api/health', timeout=3))['ok']"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  # One service per worker pool (spec v3 §8): each serves only its task queue(s) and scales on its own.
  # Sizing per pool (slots, executor, timeouts) is config/task_queues.yaml.
  worker-analysis:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: analysis}
    depends_on: [api, temporal]
    restart: unless-stopped
    command: ["analystos", "worker"]

  worker-compute:
    # CPU-bound statistics in a process pool; give it CPUs rather than replicas of the other pools.
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: compute}
    depends_on: [api, temporal]
    restart: unless-stopped  # a pool that loses a process (hung statistic killed) exits and is restarted
    command: ["analystos", "worker"]

  worker-publish:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: publish}
    depends_on: [api, temporal]
    restart: unless-stopped
    command: ["analystos", "worker"]

  worker-crawl:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    # elt runs playbook.elt_build (P4-E04): dbt parse/build via ANALYSTOS_DBT_EXECUTABLE (a dbt Core venv or image
    # with the `dbt` extra); it rides on the crawl pool until builds need their own.
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: "crawl,elt"}
    depends_on: [api, temporal]
    restart: unless-stopped
    command: ["analystos", "worker"]

  # Image for ANALYSTOS_SANDBOX_ISOLATION=container (P4-02): build it with
  #   docker compose --profile sandbox build sandbox
  # A worker next to Docker then runs each sandboxed execution as `docker run --network none --read-only`
  # of this image (see src/analystos/sandbox/isolation.py). It never runs as a service.
  sandbox:
    image: analystos-sandbox:latest
    build: {context: ./deploy/sandbox}
    profiles: ["sandbox"]
    network_mode: none
    entrypoint: ["python3", "-c", "pass"]

  scheduler:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: *app-env
    depends_on: [api]
    command: ["analystos", "scheduler"]

  web:
    build: {context: ./web, dockerfile: Dockerfile}
    depends_on:
      api: {condition: service_healthy}
    ports: ["5173:80"]

volumes:
  pgdata:
  neo4jdata:
