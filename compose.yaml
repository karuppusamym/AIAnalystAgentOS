# Full AnalystOS stack (ADR-0003). `docker compose up -d` boots infrastructure + app.
# Infra only:  docker compose up -d postgres redis neo4j temporal superset servicenow-mock
name: analystos

x-app-env: &app-env
  ANALYSTOS_DATABASE_URL: postgresql+psycopg://analystos:analystos@postgres:5432/analystos
  ANALYSTOS_ANALYTICS_LOADER_URL: postgresql+psycopg://analystos_loader:loader@postgres:5432/analytics
  ANALYSTOS_ANALYTICS_READER_URL: postgresql+psycopg://analystos_reader:reader@postgres:5432/analytics
  ANALYSTOS_REDIS_URL: redis://redis:6379/0
  ANALYSTOS_NEO4J_URI: bolt://neo4j:7687
  ANALYSTOS_TEMPORAL_ADDRESS: temporal:7233
  ANALYSTOS_SUPERSET_URL: http://superset:8088
  ANALYSTOS_SERVICENOW_MOCK_URL: http://servicenow-mock:8090
  ANALYSTOS_JWT_SECRET: ${ANALYSTOS_JWT_SECRET:-dev-only-change-me-please-32bytes!!}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: analystos
      POSTGRES_PASSWORD: analystos
      POSTGRES_DB: analystos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analystos -d analystos"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/analystos-neo4j
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.25
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: analystos
      POSTGRES_PWD: analystos
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  superset:
    image: analystos-superset:4.1.1
    build: {context: ./deploy/superset, dockerfile: Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SUPERSET_CONFIG_PATH: /app/analystos/superset_config.py
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: admin
    volumes: [./deploy/superset:/app/analystos:ro]
    entrypoint: ["/app/analystos/bootstrap.sh"]
    ports: ["8088:8088"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 40

  servicenow-mock:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    command: ["uvicorn", "analystos.connectors.servicenow_mock:app", "--host", "0.0.0.0", "--port", "8090"]
    ports: ["8090:8090"]

  api:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["sh", "-c", "analystos migrate && analystos seed && uvicorn analystos.api.app:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]

  worker:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: *app-env
    depends_on: [api, temporal]
    command: ["analystos", "worker"]

  scheduler:
    build: {context: ., dockerfile: deploy/docker/Dockerfile}
    environment: *app-env
    depends_on: [api]
    command: ["analystos", "scheduler"]

  web:
    build: {context: ./web, dockerfile: Dockerfile}
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pgdata:
  neo4jdata:
