# AnalystOS (ADR-0025: lite by default). `docker compose up -d` boots the lite profile: Postgres (pgvector),
# the API (local orchestrator with resume, in-process scheduler, preview publishing, Postgres spend caps)
# and the web UI. Three containers; everything else is an opt-in profile:
#
#   standard  Redis, Temporal, one worker serving every queue, a scheduler process
#             docker compose --env-file .env --env-file deploy/compose/standard.env up -d --build
#   scale     standard with one worker pool per task queue (today's Helm defaults; `--scale worker-compute=4`)
#             docker compose --env-file .env --env-file deploy/compose/scale.env up -d --build
#   bi        Superset (+ ANALYSTOS_SUPERSET_URL=http://superset:8088, see deploy/compose/bi.env)
#   graph     Neo4j projection (+ ANALYSTOS_GRAPH_ENABLED=true)
#   demo      the ServiceNow mock source (its own small image)
#   sandbox   the container sandbox image (build only)
#   pooled    PgBouncer (+ ANALYSTOS_PG_POOLER=pgbouncer:5432 ANALYSTOS_DB_TRANSACTION_POOLER=true)
#
# Profiles combine; a `--profile` on the command line replaces COMPOSE_PROFILES from the env files, so name
# them all, e.g. the full stack: docker compose --env-file .env --env-file deploy/compose/standard.env
#   --env-file deploy/compose/bi.env --env-file deploy/compose/demo.env --profile standard --profile bi --profile demo up -d
# Infra only for local development: docker compose --profile standard --profile bi up -d postgres redis temporal superset
# (docs/30-runbooks/04-lite-and-profiles.md; the pooled profile: docs/30-runbooks/02-operations.md "Connection pooling").
name: analystos

x-app-env: &app-env
  # Profile defaults (core/config.py): lite = local orchestrator, no Redis, no Superset.
  ANALYSTOS_PROFILE: ${ANALYSTOS_PROFILE:-lite}
  ANALYSTOS_ORCHESTRATOR: ${ANALYSTOS_ORCHESTRATOR:-local}
  ANALYSTOS_REDIS_URL: ${ANALYSTOS_REDIS_URL:-}
  ANALYSTOS_SUPERSET_URL: ${ANALYSTOS_SUPERSET_URL:-}
  ANALYSTOS_DATABASE_URL: postgresql+psycopg://analystos:analystos@${ANALYSTOS_PG_POOLER:-postgres:5432}/analystos
  ANALYSTOS_ANALYTICS_LOADER_URL: postgresql+psycopg://analystos_loader:loader@${ANALYSTOS_PG_POOLER:-postgres:5432}/analytics
  ANALYSTOS_ANALYTICS_READER_URL: postgresql+psycopg://analystos_reader:reader@${ANALYSTOS_PG_POOLER:-postgres:5432}/analytics
  # dbt keeps its role for the whole session: never through a transaction-mode pooler.
  ANALYSTOS_ANALYTICS_BUILDER_URL: postgresql+psycopg://analystos_builder:builder@postgres:5432/analytics
  # true when the URLs above go through PgBouncer in transaction mode (no server-side prepared statements).
  ANALYSTOS_DB_TRANSACTION_POOLER: ${ANALYSTOS_DB_TRANSACTION_POOLER:-false}
  ANALYSTOS_NEO4J_URI: bolt://neo4j:7687
  # Neo4j is an optional projection (off by default); start it with `--profile graph` and set this to true.
  ANALYSTOS_GRAPH_ENABLED: ${ANALYSTOS_GRAPH_ENABLED:-false}
  ANALYSTOS_TEMPORAL_ADDRESS: temporal:7233
  ANALYSTOS_SUPERSET_PUBLIC_URL: http://localhost:8088
  ANALYSTOS_SERVICENOW_MOCK_URL: ${ANALYSTOS_SERVICENOW_MOCK_URL:-}
  # Development credential for the bundled synthetic ServiceNow source (profile `demo`).
  SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD:-admin}
  # Tier 1 (.env.example): set these three (the database URL is this compose file's own) for a shared install.
  ANALYSTOS_JWT_SECRET: ${ANALYSTOS_JWT_SECRET:-dev-only-change-me-please-32bytes!!}
  ANALYSTOS_BOOTSTRAP_ADMIN_PASSWORD: ${ANALYSTOS_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
  ANALYSTOS_ENV: ${ANALYSTOS_ENV:-dev}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Python sandbox isolation (P4-02). These containers have no Docker socket and, under Docker's default
  # seccomp profile, cannot create namespaces: the sandbox is refused here (fail closed; /api/health
  # checks.sandbox). Run the worker on the host for `process`/`container` isolation, or set `off` (dev only).
  ANALYSTOS_SANDBOX_ISOLATION: ${ANALYSTOS_SANDBOX_ISOLATION:-auto}

# The worker/scheduler image carries every extra (ml, reports, temporal, graph).
x-worker-build: &worker-build
  context: .
  dockerfile: deploy/docker/Dockerfile
  args: {EXTRAS: standard}

services:
  postgres:
    image: pgvector/pgvector:pg16
    # API, workers (one pool per queue in `scale`), scheduler and Superset each keep a pool; 100 runs out.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: analystos
      POSTGRES_PASSWORD: analystos
      POSTGRES_DB: analystos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analystos -d analystos"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      # lite: core + reports; standard/scale add the Temporal client (deploy/compose/standard.env).
      args: {EXTRAS: "${ANALYSTOS_API_EXTRAS:-reports}"}
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy, required: false}
    command: ["sh", "-c", "analystos migrate && analystos seed && uvicorn analystos.api.app:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/api/health', timeout=3))['ok']"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  web:
    build: {context: ./web, dockerfile: Dockerfile}
    depends_on:
      api: {condition: service_healthy}
    ports: ["5173:80"]

  # ---------------------------------------------------------------- standard / scale
  redis:
    image: redis:7-alpine
    profiles: ["standard", "scale"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  temporal:
    image: temporalio/auto-setup:1.25
    profiles: ["standard", "scale"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: analystos
      POSTGRES_PWD: analystos
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  # standard: one worker serving every task queue (config/task_queues.yaml).
  worker:
    build: *worker-build
    profiles: ["standard"]
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: all}
    depends_on: [api, temporal]
    restart: unless-stopped
    command: ["analystos", "worker"]

  scheduler:
    build: *worker-build
    profiles: ["standard", "scale"]
    environment: *app-env
    depends_on: [api]
    command: ["analystos", "scheduler"]

  # scale: one service per worker pool (spec v3 §8): each serves only its task queue(s) and scales on its own,
  #   e.g. docker compose ... up -d --scale worker-compute=4 --scale worker-analysis=2
  worker-analysis:
    build: *worker-build
    profiles: ["scale"]
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: analysis}
    depends_on: [api, temporal]
    restart: unless-stopped
    command: ["analystos", "worker"]

  worker-compute:
    # CPU-bound statistics in a process pool; give it CPUs rather than replicas of the other pools.
    build: *worker-build
    profiles: ["scale"]
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: compute}
    depends_on: [api, temporal]
    restart: unless-stopped  # a pool that loses a process (hung statistic killed) exits and is restarted
    command: ["analystos", "worker"]

  worker-publish:
    build: *worker-build
    profiles: ["scale"]
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: publish}
    depends_on: [api, temporal]
    restart: unless-stopped
    command: ["analystos", "worker"]

  worker-crawl:
    build: *worker-build
    profiles: ["scale"]
    # elt runs playbook.elt_build (P4-E04): dbt parse/build via ANALYSTOS_DBT_EXECUTABLE (a dbt Core venv or image
    # with the `dbt` extra); it rides on the crawl pool until builds need their own.
    environment: {<<: *app-env, ANALYSTOS_WORKER_QUEUES: "crawl,elt"}
    depends_on: [api, temporal]
    restart: unless-stopped
    command: ["analystos", "worker"]

  # ---------------------------------------------------------------- optional features
  superset:
    image: analystos-superset:4.1.1
    build: {context: ./deploy/superset, dockerfile: Dockerfile}
    profiles: ["bi"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SUPERSET_CONFIG_PATH: /app/analystos/superset_config.py
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: admin
    volumes: [./deploy/superset:/app/analystos:ro]
    entrypoint: ["/app/analystos/bootstrap.sh"]
    ports: ["8088:8088"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 40

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/analystos-neo4j
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 30

  servicenow-mock:
    build: {context: ., dockerfile: deploy/docker/Dockerfile.mock}
    profiles: ["demo"]
    ports: ["8090:8090"]

  # Transaction-mode pooler (spec v3 §8), off by default: `--profile pooled`. Clients may open up to
  # MAX_CLIENT_CONN; Postgres sees at most DEFAULT_POOL_SIZE per (database, user) and
  # MAX_DB_CONNECTIONS per database. Logins are checked against pg_shadow through auth_query, so the
  # per-workspace and per-plane roles need no userlist entries.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    profiles: ["pooled"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_HOST: postgres
      DB_USER: analystos
      DB_PASSWORD: analystos
      AUTH_TYPE: scram-sha-256
      AUTH_USER: analystos
      AUTH_DBNAME: postgres
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$$1
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-30}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-40}
      MAX_PREPARED_STATEMENTS: "0"
      # A client waiting longer than this for a server connection gets an error (and the activity a
      # retry) instead of waiting forever; see the nested-transaction note in the runbook.
      QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-60}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      ADMIN_USERS: analystos
      STATS_USERS: analystos
    ports: ["6432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U analystos -d postgres || exit 1"]
      interval: 5s
      retries: 20

  # Image for ANALYSTOS_SANDBOX_ISOLATION=container (P4-02): build it with
  #   docker compose --profile sandbox build sandbox
  # A worker next to Docker then runs each sandboxed execution as `docker run --network none --read-only`
  # of this image (see src/analystos/sandbox/isolation.py). It never runs as a service.
  sandbox:
    image: analystos-sandbox:latest
    build: {context: ./deploy/sandbox}
    profiles: ["sandbox"]
    network_mode: none
    entrypoint: ["python3", "-c", "pass"]

volumes:
  pgdata:
  neo4jdata:
