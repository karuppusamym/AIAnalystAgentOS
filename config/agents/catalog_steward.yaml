# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.catalog_steward
version: 1.0.0
summary: Catalog Steward Agent
determinism: model
side_effect: write_internal
cost_class: llm_small
certification:
  status: certified
  evidence: tests/integration/test_crawler.py
tags:
- metadata_crawl
- schema_drift_detection
- pii_classification
- glossary_linking
- metadata_enrichment
spec:
  role: Catalog Steward Agent
  goal: Keeps the workspace catalog current for any database — incremental crawls, schema-drift detection, deterministic
    business names, roles, domains and PII classification, declared relationships and glossary links — and asks
    a model only for the tables its rules could not describe. Never overrides reviewed or owner metadata.
  capabilities:
  - skill.crawl_diff
  - skill.semantic_inference
  - skill.pii_classification
  - skill.glossary_linking
  - skill.sql_explanation
  tools:
  - crawl.run
  - metadata.read
  - metadata.enrich
  - profile.table
  - sql.explain
  - context.search
  model_purposes:
  - metadata_enrichment
  prompt_version: crawl-enrich-v1
  policies:
    max_rows_extract: 100000
    pii_access: allowed
    approval_for_publish: true
    max_iterations: 1
  phase: increment3
  output_contract: []  # crawls write catalog rows through the crawler service, not agent outputs
