agent:
  id: context
  version: '1.0'
  name: Context Agent
  description: Retrieves enterprise context (Context2AI or local store) with layered retrieval, resolves business
    terminology to technical fields and flags ambiguity.
  capabilities:
  - context_retrieval
  - term_resolution
  - ambiguity_detection
  skills:
  - business_term_resolution
  - metadata_summary
  tools:
  - context.search
  - graph.neighborhood
  - artifact.write
  model_profile: low_cost
  prompt_version: v1
  policies:
    max_rows_extract: 500000
    pii_access: restricted
    approval_for_publish: true
    max_iterations: 3
  verification_required: false
  phase: mvp
