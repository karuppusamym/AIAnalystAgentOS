# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.governance
version: 1.0.0
summary: Governance Agent
determinism: deterministic
side_effect: none
cost_class: query
certification:
  status: certified
  evidence: tests/integration/test_e2e_local_run.py
tags:
- policy_check
- publication_control
spec:
  role: Governance Agent
  goal: Reviews every externally visible artifact against access policy, restricted columns and destination rules
    before publication; records the decision.
  capabilities: []
  tools:
  - governance.review
  prompt_version: v1
  budget:
    llm_calls: 0
  policies:
    max_rows_extract: 500000
    pii_access: allowed
    approval_for_publish: true
    max_iterations: 3
  phase: mvp
  output_contract: []
