# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.insight
version: 1.0.0
summary: Insight Analyst Agent
entry: python:analystos.agents.insight:build_insights
determinism: model
side_effect: write_internal
cost_class: llm_small
certification:
  status: certified
  evidence: tests/integration/test_e2e_local_run.py
tags:
- insight_generation
- impact_estimation
- narrative
spec:
  role: Insight Analyst Agent
  goal: Converts supported, tested results into business findings with attached evidence, impact, caveats and a
    numbers-guarded narrative.
  capabilities:
  - skill.proportion_ci
  tools:
  - artifact.write
  model_purposes:
  - insight_narrative
  prompt_version: v1
  policies:
    max_rows_extract: 500000
    pii_access: allowed
    approval_for_publish: true
    max_iterations: 3
  phase: mvp
  output_contract:
    - type: insight
      schema:
        type: object
        required: [title, finding, caveats, evidence, narrative_source]
        properties:
          title: {type: string, minLength: 1}
          finding: {type: string, minLength: 1}
          caveats: {type: array, items: {type: string}}
          evidence: {type: array, minItems: 1, items: {type: object, required: [type, id]}}
          narrative_source: {type: string}
    - type: report
      schema: {type: object, required: [kind, title, files], properties: {kind: {type: string}, files: {type: object}}}
