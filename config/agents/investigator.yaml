# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.investigator
version: 1.0.0
summary: Investigation / Hypothesis Agent
entry: python:analystos.agents.investigator:generate_hypotheses
determinism: model
side_effect: write_internal
