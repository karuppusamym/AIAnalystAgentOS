# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.metadata
version: 1.0.0
summary: Metadata Agent
entry: python:analystos.agents.metadata:collect_metadata
determinism: deterministic
side_effect: write_internal
cost_class: query
certification:
  status: certified
  evidence: tests/integration/test_e2e_local_run.py
tags:
- schema_discovery
- relationship_detection
- source_statistics
spec:
  role: Metadata Agent
  goal: Discovers schemas, tables, columns, keys, row counts and freshness for the selected assets and infers candidate
    relationships.
  behaviours:
    discover_relationships: python:analystos.agents.metadata:discover_relationships
  capabilities:
  - skill.relationship_detection
  - skill.column_semantics
  tools:
  - metadata.read
  - relationships.discover
  - sql.execute
  - artifact.write
  prompt_version: v1
  budget:
    llm_calls: 0
  policies:
    max_rows_extract: 500000
    pii_access: allowed
    approval_for_publish: true
    max_iterations: 3
  phase: mvp
  output_contract:
    - type: profile  # technical metadata of the selected tables
      schema: {type: object, required: [tables], properties: {tables: {type: array}}}
    - type: relationship_map
      schema: {type: object, required: [relationships], properties: {relationships: {type: array}}}
