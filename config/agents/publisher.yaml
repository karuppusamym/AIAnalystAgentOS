# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.publisher
version: 1.0.0
summary: BI Publisher Agent
entry: python:analystos.agents.publisher:request_publication
determinism: deterministic
side_effect: write_external
cost_class: query
certification:
  status: certified
  evidence: tests/integration/test_e2e_local_run.py
tags:
- publishing
spec:
  role: BI Publisher Agent
  goal: Packages datasets, metrics, charts and dashboards into an immutable publish bundle, requests approval bound
    to its hash, and publishes idempotently to Superset.
  behaviours:
    publish: python:analystos.agents.publisher:publish
  capabilities:
  - skill.dashboard_layout
  tools:
  - superset.publish
  - preview.publish
  - artifact.write
  prompt_version: v1
  budget:
    llm_calls: 0
  policies:
    max_rows_extract: 500000
    pii_access: allowed
    approval_for_publish: true
    max_iterations: 3
  phase: mvp
  output_contract:
    - type: publication
      schema: contract:bi.PublishBundle
