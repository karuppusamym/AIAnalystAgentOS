# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.sql
version: 1.0.0
summary: SQL Engineer Agent
entry: python:analystos.agents.sql_agent:build_dataset
determinism: model
side_effect: write_internal
cost_class: llm_small
certification:
  status: certified
  evidence: tests/integration/test_e2e_local_run.py
tags:
- sql_generation
- sql_repair
- dataset_building
- dialect_conversion
spec:
