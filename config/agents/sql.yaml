  - skill.sql_explanation
  tools:
  - sql.execute
  - artifact.write
  model_purposes:
  - sql_generation
  - sql_repair
  prompt_version: v1
  policies:
    max_rows_extract: 500000
    pii_access: allowed
    approval_for_publish: true
    max_iterations: 3
  phase: mvp
