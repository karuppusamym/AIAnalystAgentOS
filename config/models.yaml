# Model routing (§27). Agents ask for a PURPOSE; purposes map to PROFILES; profiles list models
# in fallback order. Every model must be on the allowlist, and a workspace policy may narrow it
# further. If no allowed model can serve a profile the call fails visibly (fail closed).
providers:
  openrouter:
    kind: chat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # region: eu   # optional; unset = unknown, which fails closed under a workspace data_residency policy
  typesafe:
    # TypeSafe Jev: decision model served by the OpenRouter Decisions API. Returns typed answers
    # (choice / noul / score) with probabilities instead of text.
    kind: decision
    base_url: https://openrouter.ai/api/alpha/decisions
    api_key_env: OPENROUTER_API_KEY

allowlist:
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-5
  - openai/gpt-5.4
  - openai/gpt-5.4-mini
  - google/gemini-3.5-flash
  - google/gemini-3.5-flash-lite
  - deepseek/deepseek-v4-flash
  - typesafe/jev-1.13

# Versioned price table (P4-T07). Prices are USD per million tokens. They serve (a) the pre-call
# approval estimate (policy.expensive_model_approval_usd) and (b) the recorded cost when the provider
# does not report usage.cost (model_call.cost_source = price_table@<prices_version>). A model with no
# price and no provider-reported cost is recorded as cost_source=missing_price and surfaced in
# /api/admin/token-savings; it is never silently counted as $0. Bump prices_version on every change.
# `region` overrides the provider region; unset = unknown (fails closed under data_residency).
prices_version: "2026-09-25"
models:
  anthropic/claude-sonnet-5: {input_usd_per_mtok: 3.0, output_usd_per_mtok: 15.0}
  anthropic/claude-opus-5: {input_usd_per_mtok: 5.0, output_usd_per_mtok: 25.0}
  openai/gpt-5.4: {input_usd_per_mtok: 2.5, output_usd_per_mtok: 15.0}
  openai/gpt-5.4-mini: {input_usd_per_mtok: 0.75, output_usd_per_mtok: 4.5}
  google/gemini-3.5-flash: {input_usd_per_mtok: 0.3, output_usd_per_mtok: 2.5}
  google/gemini-3.5-flash-lite: {input_usd_per_mtok: 0.1, output_usd_per_mtok: 0.4}
  deepseek/deepseek-v4-flash: {input_usd_per_mtok: 0.1, output_usd_per_mtok: 0.4}

profiles:
  reasoning_strong:
    models: [anthropic/claude-sonnet-5, openai/gpt-5.4]
    temperature: 0.2
    max_tokens: 4000
    timeout_seconds: 120
  coding:
    models: [anthropic/claude-sonnet-5, openai/gpt-5.4-mini]
    temperature: 0.0
    max_tokens: 2500
    timeout_seconds: 90
  analytical_reasoning:
    models: [anthropic/claude-sonnet-5, google/gemini-3.5-flash]
    temperature: 0.2
    max_tokens: 4000
    timeout_seconds: 120
  low_cost:
    models: [google/gemini-3.5-flash-lite, deepseek/deepseek-v4-flash]
    temperature: 0.2
    max_tokens: 2000
    timeout_seconds: 60
  # Verification must come from a different model family than the primary analyst profile.
  independent_model_family:
    models: [openai/gpt-5.4-mini, google/gemini-3.5-flash]
    temperature: 0.0
    max_tokens: 2000
    timeout_seconds: 90
    exclude_families: [anthropic]
  decision:
    provider: typesafe
    models: [typesafe/jev-1.13]  # pinned: aliases can shift verdicts
    timeout_seconds: 20

# Execution ladder per purpose (spec v3 §4.1, ADR-0012), cheapest rung first:
# cache (L0) -> registry (L1) -> rules (L2) -> decision (L3) -> llm_small (L4) -> llm_large (L5).
# A rules/registry rung before the model rung = deterministic first ("auto"); the model rung is only
# reached when the deterministic result is insufficient. Model rungs name the routed profile's class
# (low_cost -> llm_small, decision -> decision, otherwise llm_large); the recorded answered_by is the
# profile actually used (a budget downgrade answers from llm_small). Admins override per purpose in
# platform settings (llm.ladders / llm.purpose_modes). A purpose without an entry is model first.
ladders:
  planning: [cache, rules, llm_large]
  hypothesis_generation: [cache, registry, rules, llm_large]
  follow_up_generation: [cache, rules, llm_large]
  sql_generation: [cache, registry, llm_large]
  sql_repair: [cache, llm_large]
  statistical_interpretation: [cache, llm_large]
  insight_narrative: [cache, rules, llm_small]
  semantic_modeling: [cache, rules, llm_large]
  dashboard_design: [cache, rules, llm_small]
  feedback_interpretation: [cache, rules, llm_large]
  summarization: [cache, rules, llm_small]
  agent_actions: [cache, rules, llm_small]
  metadata_enrichment: [cache, rules, llm_small]
  verification: [cache, llm_large]  # runs only when the workspace policy opts in (independent_model_verification)
  hypothesis_priority: [cache, rules, decision]
  risk_check: [cache, decision]  # escalate-only; no longer called at publish (the tier is fixed high)
  feedback_classification: [cache, rules, decision]
  chart_selection: [cache, rules, decision]
  rev_second_opinion: [cache, decision]
  stop_check: [cache, rules, decision]
  alert_triage: [cache, decision, rules]
  ask_route: [cache, rules, decision]
  clarify_needed: [cache, rules, decision]
  metric_match: [cache, rules, decision]
  join_path_choice: [cache, rules, decision]
  decision_structured: [cache, llm_small]  # the DecisionService's structured-output backend

routing:
  planning: reasoning_strong
  hypothesis_generation: analytical_reasoning
  follow_up_generation: analytical_reasoning
  sql_generation: coding
  sql_repair: coding
  statistical_interpretation: analytical_reasoning
  insight_narrative: low_cost
  semantic_modeling: coding
  dashboard_design: low_cost
  feedback_interpretation: coding
  summarization: low_cost
  agent_actions: low_cost  # declarative agents (agents/generic.py) propose typed actions; default_actions are the rule path
  metadata_enrichment: low_cost
  verification: independent_model_family
  # JEV decision purposes
  hypothesis_priority: decision
  risk_check: decision
  feedback_classification: decision
  chart_selection: decision
  rev_second_opinion: decision
  stop_check: decision
  alert_triage: decision
  ask_route: decision
  clarify_needed: decision
  metric_match: decision
  join_path_choice: decision
  # DecisionService `llm_structured` backend: a small chat model answering with a strict JSON schema
  decision_structured: low_cost

# DecisionService (ADR-0015, spec v3 §5). Every decision purpose declares its authority class, its
# backends in order, a timeout and (through `rules`) a deterministic fallback. Backends: jev | rules |
# local_classifier | llm_structured. No backend may grant, lower a risk, skip a gate or suppress an
# alert: the authority class is enforced in analystos/decisions/authority.py, whatever a backend answers.
#   rank                 order valid options (never drop one)
#   choose_presentation  pick among rule-valid presentations
#   escalate_only        raise risk/severity or ask the user; `rules` sets the baseline and must come first
#   route                pick a processing path among valid ones (needs calibration)
#   bounded_stop         end exploration only after the minimum work; `rules` first (needs calibration)
decisions:
  defaults:
    timeout_seconds: 3          # per decision, across its model backends; rules always run inline
    breaker_failures: 3         # consecutive failures that open a backend's circuit
    breaker_reset_seconds: 30   # open -> half-open (one probe) after this long
  purposes:
    hypothesis_priority: {kind: scores, authority: rank, backends: [jev, rules]}
    metric_match: {kind: scores, authority: rank, backends: [jev, rules]}
    join_path_choice: {kind: scores, authority: rank, backends: [rules, jev]}
    chart_selection: {kind: choice, authority: choose_presentation, backends: [rules, jev]}
    feedback_classification: {kind: choice, authority: route, backends: [jev, rules], default: redirect}
    ask_route: {kind: choice, authority: route, backends: [rules, jev, local_classifier], default: generate}
    rev_second_opinion: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    alert_triage: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    risk_check: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    clarify_needed: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    stop_check: {kind: probability, authority: bounded_stop, backends: [rules, jev], min_rounds: 1, min_supported: 3, stop_at: 0.85}
