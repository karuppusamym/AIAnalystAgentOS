{{- $ctx := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "analystos.fullname" . }}-api
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "analystos.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "analystos.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- include "analystos.podCommon" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: 60   # open SSE streams get time to close
      containers:
        - name: api
          image: {{ include "analystos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "analystos.api.app:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}",
                    "--workers", "{{ .Values.api.uvicornWorkers }}", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}}
          {{- include "analystos.appEnv" . | nindent 10 }}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:       # /api/health answers once the app has loaded; body.ok = control-plane DB reachable
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:        # process-level only: a dependency outage must not restart every API pod
            tcpSocket: {port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- include "analystos.appVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "analystos.fullname" . }}-api
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "analystos.selector" $ctx | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
{{- include "analystos.pdb" (dict "root" . "component" "api" "pdb" .Values.api.pdb) }}
{{- include "analystos.hpa" (dict "root" . "component" "api" "autoscaling" .Values.api.autoscaling) }}
