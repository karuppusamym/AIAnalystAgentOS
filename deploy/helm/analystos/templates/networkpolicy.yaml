{{- if or .Values.networkPolicy.enabled .Values.airGapped.enabled }}
# Egress lock-down (air-gapped mode forces it on): pods reach cluster DNS, each other, and only the
# CIDRs listed in airGapped.allowedEgressCidrs (external Postgres / Redis / Temporal / Superset, the
# local model server, the IdP, data sources). Everything else - including any public model API - is
# dropped by the CNI, underneath the application's own egress guard (llm/router.py HttpTransport).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "analystos.fullname" . }}-egress
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress, Ingress]
  ingress:
    - {}                      # ingress stays open to the namespace's ingress controller / services
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Values.airGapped.allowedEgressCidrs }}
    - to:
        {{- range .Values.airGapped.allowedEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
    {{- end }}
{{- end }}
