# HA overlay: helm install analystos deploy/helm/analystos -f values-ha.yaml [-f your-values.yaml]
# Three API replicas behind a PDB, every worker pool at >= 2 replicas with a PDB, two schedulers
# (claim-then-execute makes that safe), zone + host spread for every Deployment. Pair with HA external
# services: Postgres (primary + replica, PgBouncer), Redis (Sentinel or managed), Temporal (its own chart,
# frontend/history/matching >= 2) and Superset (its own chart). Sized toward the spec v3 §8 targets
# (50 concurrent runs on four worker nodes); measured numbers belong in the capability register (P4-S05).
topologySpread: true

api:
  replicas: 3
  uvicornWorkers: 4
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 4Gi}
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 65}
  pdb: {enabled: true, minAvailable: 2}

workers:
  analysis:
    queues: analysis
    replicas: 4
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "2", memory: 3Gi}
    autoscaling: {enabled: true, minReplicas: 4, maxReplicas: 12, targetCPUUtilizationPercentage: 70}
    pdb: {enabled: true, minAvailable: 2}
  compute:
    queues: compute
    replicas: 4
    resources:
      requests: {cpu: "4", memory: 6Gi}
      limits: {cpu: "4", memory: 8Gi}
    autoscaling: {enabled: true, minReplicas: 4, maxReplicas: 16, targetCPUUtilizationPercentage: 75}
    pdb: {enabled: true, minAvailable: 2}
  publish:
    queues: publish
    replicas: 2
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: true, minAvailable: 1}
  crawl:
    queues: crawl
    replicas: 2
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: true, minAvailable: 1}
  elt:
    queues: elt
    replicas: 0
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}

scheduler:
  replicas: 2
  pdb: {enabled: true, minAvailable: 1}

web:
  replicas: 3
  pdb: {enabled: true, minAvailable: 2}

networkPolicy:
  enabled: true
