# AnalystOS Helm chart (P4-S04). Defaults are a small single-zone install against EXTERNAL
# Postgres (pgvector), Redis, Temporal and Superset; `values-ha.yaml` layers the HA sizing on top and
# `values-airgapped.yaml` the air-gapped mode. Secrets are never values: every credential comes from a
# Kubernetes Secret (`secrets.existingSecret`), read into the pods with envFrom.

image:
  registry: ""                         # e.g. registry.internal:5000 for an offline bundle (scripts/bundle_images.sh)
  repository: analystos/app
  tag: ""                              # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
webImage:
  repository: analystos/web
  tag: ""
imagePullSecrets: []

# ANALYSTOS_ENV: anything but `dev` skips the demo accounts with known passwords at seed time.
env: production

# Non-secret settings (rendered into a ConfigMap as ANALYSTOS_* variables).
config:
  temporalAddress: temporal-frontend.temporal.svc:7233
  temporalNamespace: default
  temporalQueuePrefix: analystos     # every pool of one installation must share the prefix
  supersetUrl: http://superset.superset.svc:8088
  webUrl: https://analystos.example.com
  corsOrigins: https://analystos.example.com
  orchestrator: temporal
  graphEnabled: false                # Neo4j is an optional projection (spec v3 §8)
  # Sandbox children (python.execute) in an empty network namespace. `require` (default) refuses to run
  # the sandbox where the node cannot create one (typical under RuntimeDefault seccomp without
  # unprivileged user namespaces), so a child never silently has the pod's network. `isolate` falls
  # back to a networked child (logged, network_isolated=false): only with networkPolicy.enabled.
  sandboxNetwork: require            # require | isolate | off
  extra: {}                          # any other ANALYSTOS_* setting, e.g. {ANALYSTOS_QUERY_MAX_ROWS: "20000"}

secrets:
  # Name of a Secret holding at least ANALYSTOS_DATABASE_URL, ANALYSTOS_ANALYTICS_LOADER_URL,
  # ANALYSTOS_ANALYTICS_READER_URL, ANALYSTOS_ANALYTICS_BUILDER_URL (the BuildGateway's login; outside
  # env=dev its password must not be the development default, or provisioning and builds refuse), ANALYSTOS_REDIS_URL, ANALYSTOS_JWT_SECRET, ANALYSTOS_BOOTSTRAP_ADMIN_PASSWORD,
  # ANALYSTOS_SUPERSET_PASSWORD; optional OPENROUTER_API_KEY, ANTHROPIC_API_KEY, AZURE_OPENAI_API_KEY,
  # ANALYSTOS_OIDC_CLIENT_SECRET and source passwords referenced by `secret_ref: env:NAME`.
  existingSecret: analystos-secrets

# Connection pools per process and plane (P4-S05, src/analystos/db/pools.py). Every API process,
# worker process and compute-pool child holds its own pools, so Postgres needs roughly
# processes x (control + analytics + loader maxima) connections without a pooler. `mode: none` drops
# the client-side pool (a connection per checkout) for use behind PgBouncer.
database:
  pools:
    mode: queue                      # queue | none
    recycleSeconds: -1               # below any idle cut-off between the pods and Postgres
    control: {size: 10, maxOverflow: 20, timeoutSeconds: 30}
    analytics: {size: 5, maxOverflow: 5, timeoutSeconds: 30}   # the reader identity, per source URL
    loader: {size: 2, maxOverflow: 3, timeoutSeconds: 30}
  # The Secret's control/loader/reader URLs go through a transaction-mode pooler (turns off psycopg's
  # server-side prepared statements). Forced on when pgbouncer.enabled.
  transactionPooler: false

# Optional in-release PgBouncer (spec v3 §8), off by default. Transaction pooling for the control
# plane and the analytics loader/reader; point those three URLs in the Secret at
# `<release>-analystos-pgbouncer:5432`. Keep ANALYSTOS_ANALYTICS_BUILDER_URL direct: dbt sets its role
# for the whole session. Logins are checked with auth_query against pg_shadow as the Secret's
# DB_USER/DB_PASSWORD (a role allowed to read pg_shadow), so workspace roles need no userlist.
pgbouncer:
  enabled: false
  image: {repository: edoburu/pgbouncer, tag: v1.23.1-p3}
  replicas: 2
  postgresHost: ""                   # required when enabled
  postgresPort: 5432
  existingSecret: ""                 # Secret with DB_USER and DB_PASSWORD (the auth_query login)
  authDbname: postgres
  poolMode: transaction
  maxClientConn: 2000                # client connections (cheap): every pod's pools together
  defaultPoolSize: 20                # server connections per (database, user) and replica
  maxDbConnections: 40               # server connections per database and replica
  # Keep the control database's pool above the concurrent analysis slots (runbook "Connection pooling"):
  # a client waiting longer than this for a server connection gets an error and the activity retries.
  queryWaitTimeoutSeconds: 60
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
  pdb: {enabled: false, minAvailable: 1}

# Model providers. `modelsConfig` picks the file inside the image (config/models*.yaml) or a mounted one.
models:
  modelsConfig: ""                   # "" = config/models.yaml (OpenRouter)
  customConfig: ""                   # inline models YAML; mounted at /etc/analystos/models.yaml and used when set

airGapped:
  enabled: false                     # ANALYSTOS_AIR_GAPPED: only `egress: internal` providers, rules/local_classifier decisions
  localModel:
    url: ""                          # ANALYSTOS_LOCAL_LLM_URL, e.g. http://vllm.llm.svc:8000/v1
  # Egress the pods keep under the NetworkPolicy (cluster DNS is always allowed). CIDRs of the external
  # Postgres / Redis / Temporal / Superset / local model / IdP / sources.
  allowedEgressCidrs: []

oidc:
  enabled: false
  issuer: ""
  clientId: ""
  redirectUri: ""                    # https://<host>/api/auth/oidc/callback
  scopes: "openid email profile groups"
  groupsClaim: groups
  providerName: Single sign-on
  passwordLogin: true                # keep a break-glass local admin
  mapping: |                         # config/oidc.yaml format: groups -> roles, claims -> ABAC attributes
    platform_admin_groups: []
    workspace_roles: []
    attributes: {department: department, region: region}  # clearances are never IdP-mapped (platform-controlled)
    require_group: false

migrations:
  enabled: true                      # pre-install/pre-upgrade Job: analystos migrate && analystos seed
  backoffLimit: 2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

api:
  replicas: 2
  port: 8000
  uvicornWorkers: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: true, minAvailable: 1}
  service: {type: ClusterIP, port: 8000}

# One Deployment per Temporal task-queue pool (P4-S01, config/task_queues.yaml). Per-process slots,
# executor type and activity timeouts are baked into the image; keep the compute pool's cpu limit at
# least its process-pool size (task_queues.yaml `compute.max_concurrent`, default 4).
# In-flight workflows must be drained (or continue-as-new) before an upgrade that changes workflow code.
workers:
  analysis:            # I/O-bound agent steps + AnalysisWorkflow
    queues: analysis
    replicas: 2
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
    pdb: {enabled: true, minAvailable: 1}
  compute:             # CPU-bound statistics in a process pool
    queues: compute
    replicas: 2
    resources:
      requests: {cpu: "2", memory: 3Gi}
      limits: {cpu: "4", memory: 6Gi}
    autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 12, targetCPUUtilizationPercentage: 75}
    pdb: {enabled: true, minAvailable: 1}
  publish:             # BI side effects; few replicas keep the destination's rate limits honest
    queues: publish
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}
  crawl:               # metadata crawls
    queues: crawl
    replicas: 1
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}
  # ELT builds (P4-E04/E06) run dbt Core as a separate executable, which is NOT in the app image: the
  # pool stays at 0 replicas (the queue answers queue_ping only) until an image with dbt
  # (ANALYSTOS_DBT_EXECUTABLE) and ANALYSTOS_ANALYTICS_BUILDER_URL in the Secret is supplied.
  elt:
    queues: elt
    replicas: 0
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}

scheduler:
  # Claim-then-execute: several replicas never fire a schedule twice, so 2 is safe for HA.
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  pdb: {enabled: false, minAvailable: 1}

web:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  pdb: {enabled: true, minAvailable: 1}
  service: {type: ClusterIP, port: 80}

ingress:
  enabled: false
  className: ""
  host: analystos.example.com
  annotations: {}
  tls: []                            # [{secretName: analystos-tls, hosts: [analystos.example.com]}]

networkPolicy:
  # Forced on when airGapped.enabled. Off by default only because the chart cannot know the CIDRs of the
  # external Postgres / Redis / model APIs; with sandboxNetwork=isolate turn it on (egress: DNS, the
  # release's pods, airGapped.allowedEgressCidrs), else the sandbox fallback has the pod's network.
  enabled: false

serviceAccount:
  create: true
  name: ""
  automountToken: false

nodeSelector: {}
tolerations: []
affinity: {}
topologySpread: false                # spread each Deployment across zones (values-ha.yaml turns it on)
