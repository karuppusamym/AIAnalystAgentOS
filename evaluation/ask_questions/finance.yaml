# P4-V02 Ask accuracy benchmark — finance (evaluation.datasets.finance, seed 1, plus the restricted column).
# Frozen 2026-09-25 before any tier was run. See README.md for how it was written and scored.
domain: finance
restricted_column: vendor_iban

registry:
  - name: invoice_amount_by_vendor_category
    patterns: ["Total invoice amount by vendor category"]
    sql: SELECT vendor_category, SUM(invoice_amount) AS total_amount FROM @table GROUP BY vendor_category
  - name: late_rate_by_unit
    patterns: ["Late payment rate by business unit"]
    sql: SELECT business_unit, AVG(CASE WHEN paid_late THEN 1.0 ELSE 0.0 END) AS late_rate FROM @table GROUP BY business_unit
  - name: days_to_pay_by_unit
    patterns: ["Average days to pay by business unit"]
    sql: SELECT business_unit, AVG(days_to_pay) AS avg_days_to_pay FROM @table GROUP BY business_unit
  - name: invoices_by_currency
    patterns: ["How many invoices per currency?"]
    sql: SELECT currency, COUNT(*) AS invoices FROM @table GROUP BY currency
  - name: invoice_amount_for_unit
    patterns: ["Total invoice amount for {business_unit}"]
    sql: SELECT SUM(invoice_amount) AS total_amount FROM @table WHERE business_unit = {{business_unit}}
    parameters: [{name: business_unit, type: enum, column: business_unit, values_from: business_unit}]
    example: {business_unit: Retail}
  - name: monthly_invoice_amount
    patterns: ["Monthly invoice amount", "Invoice amount per month"]
    sql: SELECT date_trunc('month', invoice_date) AS month, SUM(invoice_amount) AS total_amount FROM @table GROUP BY 1
  - name: invoices_over_amount
    patterns: ["How many invoices are over {amount}?"]
    sql: SELECT COUNT(*) AS invoices FROM @table WHERE invoice_amount > {{amount}}
    parameters: [{name: amount, type: number, column: invoice_amount}]
    example: {amount: 1000}
  - name: late_invoices_for_category
    patterns: ["How many late invoices for {vendor_category}?"]
    sql: SELECT COUNT(*) AS invoices FROM @table WHERE paid_late AND vendor_category = {{vendor_category}}
    parameters: [{name: vendor_category, type: enum, column: vendor_category, values_from: vendor_category}]
    example: {vendor_category: Utilities}
  - name: invoices_by_entry_channel
    patterns: ["Number of invoices by entry channel"]
    sql: SELECT entry_channel, COUNT(*) AS invoices FROM @table GROUP BY entry_channel

