# P4-V02 Ask accuracy benchmark — ITSM (evaluation.datasets.itsm, seed 1, plus the restricted column).
# Frozen 2026-09-25 before any tier was run. See README.md for how it was written and scored.
# `@table` is replaced with the staged table's schema-qualified name at run time.
domain: itsm
restricted_column: caller_email

# The workspace's verified-query registry: what an analyst would already have promoted. Written
# first, from the table alone; the questions below were written against it afterwards.
registry:
  - name: incidents_by_priority
    patterns: ["How many incidents per priority?"]
    sql: SELECT priority, COUNT(*) AS incidents FROM @table GROUP BY priority
  - name: sla_breach_rate_by_group
    patterns: ["What is the SLA breach rate by assignment group?"]
    sql: SELECT assignment_group_name, AVG(CASE WHEN made_sla THEN 0.0 ELSE 1.0 END) AS breach_rate FROM @table GROUP BY assignment_group_name
  - name: resolution_hours_by_group
    patterns: ["Average resolution hours by assignment group"]
    sql: SELECT assignment_group_name, AVG(EXTRACT(EPOCH FROM resolved_at - opened_at) / 3600.0) AS avg_resolution_hours FROM @table GROUP BY assignment_group_name
  - name: incidents_for_priority
    patterns: ["How many incidents for priority {priority}?"]
    sql: SELECT COUNT(*) AS incidents FROM @table WHERE priority = {{priority}}
    parameters: [{name: priority, type: number, column: priority}]
    example: {priority: 1}
  - name: incidents_for_group
    patterns: ["How many incidents for {assignment_group_name}?"]
    sql: SELECT COUNT(*) AS incidents FROM @table WHERE assignment_group_name = {{assignment_group_name}}
    parameters: [{name: assignment_group_name, type: enum, column: assignment_group_name, values_from: assignment_group_name}]
    example: {assignment_group_name: Network}
  - name: incidents_per_month
    patterns: ["Incidents opened per month", "Monthly incident volume"]
    sql: SELECT date_trunc('month', opened_at) AS month, COUNT(*) AS incidents FROM @table GROUP BY 1
  - name: top_ci_priority_1
    patterns: ["Which configuration item has the most priority 1 incidents?"]
    sql: SELECT cmdb_ci_name, COUNT(*) AS incidents FROM @table WHERE priority = 1 GROUP BY cmdb_ci_name ORDER BY incidents DESC LIMIT 1
  - name: incidents_opened_between
    patterns: ["How many incidents were opened between {start} and {end}?"]
    sql: SELECT COUNT(*) AS incidents FROM @table WHERE opened_at >= {{start}} AND opened_at < {{end}}
    parameters: [{name: start, type: date, column: opened_at}, {name: end, type: date, column: opened_at}]
    example: {start: "2025-01-01", end: "2025-02-01"}
  - name: sla_breach_rate_by_reassignments
    patterns: ["SLA breach rate by reassignment count"]
    sql: SELECT reassignment_count, AVG(CASE WHEN made_sla THEN 0.0 ELSE 1.0 END) AS breach_rate FROM @table GROUP BY reassignment_count

questions:
