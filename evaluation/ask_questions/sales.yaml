# P4-V02 Ask accuracy benchmark — sales (evaluation.datasets.sales, seed 1, plus the restricted column).
# Frozen 2026-09-25 before any tier was run. See README.md for how it was written and scored.
domain: sales
restricted_column: customer_email

registry:
  - name: revenue_by_region
    patterns: ["Total revenue by sales region"]
    sql: SELECT sales_region, SUM(net_amount) AS revenue FROM @table GROUP BY sales_region
  - name: return_rate_by_channel
    patterns: ["What is the return rate by channel?"]
    sql: SELECT channel, AVG(CASE WHEN returned THEN 1.0 ELSE 0.0 END) AS return_rate FROM @table GROUP BY channel
  - name: orders_by_segment
    patterns: ["How many orders per customer segment?"]
    sql: SELECT customer_segment, COUNT(*) AS orders FROM @table GROUP BY customer_segment
  - name: order_value_by_segment
    patterns: ["Average order value by customer segment"]
    sql: SELECT customer_segment, AVG(net_amount) AS avg_order_value FROM @table GROUP BY customer_segment
  - name: revenue_for_region
    patterns: ["Total revenue for {sales_region}"]
    sql: SELECT SUM(net_amount) AS revenue FROM @table WHERE sales_region = {{sales_region}}
    parameters: [{name: sales_region, type: enum, column: sales_region, values_from: sales_region}]
    example: {sales_region: EMEA}
  - name: monthly_revenue
    patterns: ["Monthly revenue", "Revenue per month"]
    sql: SELECT date_trunc('month', order_date) AS month, SUM(net_amount) AS revenue FROM @table GROUP BY 1
  - name: orders_for_channel
    patterns: ["How many orders came through the {channel} channel?"]
    sql: SELECT COUNT(*) AS orders FROM @table WHERE channel = {{channel}}
    parameters: [{name: channel, type: enum, column: channel, values_from: channel}]
    example: {channel: web}
  - name: revenue_since
    patterns: ["Total revenue since {start}"]
    sql: SELECT SUM(net_amount) AS revenue FROM @table WHERE order_date >= {{start}}
    parameters: [{name: start, type: date, column: order_date}]
    example: {start: "2025-01-01"}
  - name: shipping_days_by_region
    patterns: ["Average shipping days by region"]
    sql: SELECT sales_region, AVG(shipping_days) AS avg_shipping_days FROM @table GROUP BY sales_region

