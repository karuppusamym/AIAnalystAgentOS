        - {id: effort_by_team, method: numeric_by_segment, outcome: effort_hours, segment: fulfilment_team, top: Field Ops}
        - {id: fulfilment_by_site, method: numeric_by_segment, outcome: "submitted_ts->fulfilled_ts", segment: site, top: Rotterdam}
      nulls: [request_channel, cost_center]
  - id: HO-ITSM-05
    family: analysis
    domain: itsm
    generator: itsm_change_request
    seed: 7005
    effects: false
    objective: "Explain what drives change rollbacks and change downtime."
    rubric:
      expect: abstain
      abstain_kind: no_finding
      why: "global null: rollbacks and downtime are independent of every column"
      truth: {approvals_required: [risk_tier]}
      planted: []
      nulls: [change_board, requester_org, change_model]
  - id: HO-ITSM-06
    family: analysis
    domain: itsm
