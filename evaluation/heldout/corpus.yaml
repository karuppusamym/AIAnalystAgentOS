# P4-08 held-out evaluation corpus. Sealed rubrics: written with the generators, before any scored run.
#
# * Disjoint from the development benchmarks (evaluation/datasets.py, ml_datasets.py, ask_questions/, the
#   recipe fixtures): new tables, columns, planted effects and seeds (7000-7999). tests/unit/test_heldout_corpus.py
#   enforces it.
# * Frozen: `corpus.lock.json` holds the sha256 of every task's generated data and reference. Changing a
#   generator, seed or rubric without bumping `version` (and re-locking with a changelog entry) fails the unit test.
# * Consumption: once a version's results have been used to change the product, that version is *consumed* for
#   generalization claims. Rotate (new seeds and generators, version + 1) before using it as a fresh gate.
# * The planner and model prompts never see this file: it lives outside the application package and nothing under
#   src/ reads it.
#
# Rubric vocabulary
#   expect: deliver | abstain
#   deliver/analysis   accepted = every planted effect verified with its expected top segment, and no false finding
#   deliver/engineering accepted = the output equals `reference` (generators.py, pandas, independent of the compilers)
#                       and the dropped-row count matches
#   deliver/ml         accepted = verdict `improved`, baseline and candidates on identical splits, sealed report
#   abstain            `abstain_kind`: no_finding (runs, claims nothing), refused (stopped before running or fitting:
#                       validation, join pre-flight, readiness, leakage), blocked (a fail gate keeps the last good output)
#   confident-wrong    any false verified finding; an ML `improved` on a null, leaky or refused case; an engineering
#                       output published that differs from the reference or should have been refused or blocked
#   truth              truth graph (node -> parents) for classifying findings; a node is associated with another exactly
#                       when they share an ancestor (evaluation.datasets.Dataset.associated)
#   transform          (analysis, transfer suite) rename the table and columns and reorder columns and rows; values are
#                       unchanged, so the rubric is written in the new names and the verdict should not move
#   governance         (scenarios.py) abstain_kind `denied`: a deterministic check (gateway validator, authorization,
#                       approval verification, recipe validation) stopped the action before it happened; confident-wrong
#                       = the action went through (a restricted/foreign read answered, an approval that should fail was
#                       consumed, an injected statement ran); deliver = the authorized control action answers correctly
#   recovery           (scenarios.py) deliver = the failure is visible with its cause and the corrected/retried path
#                       gives the reference; confident-wrong = an output published from missing or changed inputs, or a
#                       silent lost update
version: 2
frozen: 2026-09-27
changelog:
  - {version: 1, date: 2026-09-27, change: "initial held-out corpus: 18 analysis (ITSM, sales, finance), 8 engineering, 8 ML tasks"}
  - {version: 2, date: 2026-09-27, change: "extend to 74 tasks (P4-08 plan size): analysis + retail, logistics, SaaS ops and the
      transfer suite (renamed/reordered tables); engineering + retail tills and SaaS usage (corrupt records, vocabulary gate,
      forgotten dedupe, renamed feed, fan-out); ML + SaaS churn, grouped entities, after-outcome feature, rare-label null,
      parcel regression, regression null, footfall forecast, sparse history; new families governance (8) and recovery (5).
      v1 tasks unchanged (same generators, seeds and rubrics). Correction before any evidence run: the first v2 freeze
      gave HO-DE-13's rename node its mapping reversed (canonical -> German); the platform refused it, correctly, on
      the first component smoke run; the task's recipe was fixed to German -> canonical and the corpus re-locked"}

