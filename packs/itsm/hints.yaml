# Naming vocabulary the deterministic skills merge from every installed pack (they only add to core).
acronyms: {sla: SLA, ci: CI, p1: P1, mttr: MTTR}
# Surrogate key of every ServiceNow table: the join target of reference fields and a must-be-unique key.
key_columns: [sys_id]
# Name columns of referenced tables used to label joined keys in analytical datasets.
display_columns: [u_name]
# Words naming when a record starts (the dataset's default time axis).
event_start: [opened]
# (start, end) timestamp pairs that must be ordered (data-quality temporal_order).
lifecycle_pairs:
  - [opened_at, resolved_at]
  - [opened_at, closed_at]
  - [resolved_at, closed_at]
  - [opened_at, work_start]
  - [sys_created_on, sys_updated_on]
  - [sys_created_on, closed_at]
  - [created_at, resolved_at]
# Glossary scan (knowledge/glossary_scan.py): what an abbreviation in a table or column name stands for (a short
# expansion becomes a synonym; a longer text is the proposed definition), and column-name prefixes whose meaning a
# person should confirm. Every one is a suggestion in the review queue, never a glossary entry by itself.
glossary_expansions:
  sys: "Fields whose name starts with sys_ are maintained by ServiceNow itself (sys_id is the record's unique identifier, sys_updated_on when it last changed), not entered by people."
  ci: Configuration Item
  cmdb: Configuration Management Database
  sla: Service Level Agreement
  mttr: Mean Time To Resolve
name_prefixes:
  u_: "Fields whose name starts with u_ are custom fields added to this ServiceNow instance, not part of the base product: their meaning is local and should be written down by their owner."
# Crawler table-domain vocabulary (skills/catalog domain classification).
domain_keywords:
  it_operations: [incident, problem, change, ticket, ci, cmdb, sla, assignment, caller, outage, alert, server, host,
                  deployment, sys, itsm, knowledge, escalation, reassignment, servicenow, configuration, resolved,
                  resolution, urgency, impact, assigned, request, task]
# PII: a "<noun>_name" / "<noun>_id_name" column names a person (caller_id_name, opened_by_name, ...).
person_nouns: [caller, opened, resolved, assigned]
# Ask: complete, unfiltered count distributions answered by a schema-bound rule (no model call).
# `ambiguous` words (e.g. "type") are never mapped silently: the user picks a dimension.
ask_distributions:
  - entity: incident
    nouns: [incident, incidents]
    dimensions:
      - {label: Category, column: category, words: [category]}
      - {label: Contact channel, column: contact_type, words: [contact type, channel]}
    ambiguous: [type]
