[project]
name = "analystos"
version = "0.1.0"
description = "Context2AI AnalystOS - autonomous, governed data & analytics agent operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "httpx>=0.27",
  "sqlglot>=25.0",
  "duckdb>=1.1",
  "polars>=1.5",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "temporalio>=1.7",
  "neo4j>=5.23",
  "redis>=5.0",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "pyyaml>=6.0",
  "croniter>=3.0",
  "python-multipart>=0.0.9",
  "fpdf2>=2.7",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]
sqlserver = ["pymssql>=2.3"]
# MCP client and server (P4-X05/X06): the official SDK, streamable HTTP, protocol 2026-07-28.
mcp = ["mcp>=2.2"]
# Source drivers (config/source_kinds.yaml names the extra each kind needs).
mysql = ["pymysql>=1.1"]
oracle = ["oracledb>=2.0"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
bigquery = ["sqlalchemy-bigquery>=1.11"]
databricks = ["databricks-sqlalchemy>=2.0"]
trino = ["trino>=0.330"]
clickhouse = ["clickhouse-sqlalchemy>=0.3"]
duckdb = ["duckdb-engine>=0.13"]
redshift = ["sqlalchemy-redshift>=0.8", "psycopg2-binary>=2.9"]
all-sources = [
  "pymssql>=2.3",
  "pymysql>=1.1",
  "oracledb>=2.0",
  "snowflake-sqlalchemy>=1.6",
  "sqlalchemy-bigquery>=1.11",
  "databricks-sqlalchemy>=2.0",
  "trino>=0.330",
  "clickhouse-sqlalchemy>=0.3",
  "duckdb-engine>=0.13",
  "sqlalchemy-redshift>=0.8",
  "psycopg2-binary>=2.9",
]

[project.scripts]
analystos = "analystos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analystos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: needs the docker-compose stack (Postgres, Redis, Neo4j, Temporal, Superset)",
  "live_llm: calls OpenRouter with a real OPENROUTER_API_KEY",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
