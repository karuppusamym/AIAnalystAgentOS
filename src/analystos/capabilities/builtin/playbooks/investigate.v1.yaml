# The v1 analyst lifecycle (spec v2 §5) as data. It reproduces the v1 plan hash for the same inputs
# (tests/unit/test_playbooks.py pins it), so the order, titles, agents and dependencies below are
# part of the hash: change them only with a new playbook version.
apiVersion: analystos/v1
kind: Playbook
id: playbook.investigate
version: 1.0.0
summary: Investigate a business objective end to end (context, hypotheses, verified findings, dashboards, approved publication)
determinism: model
side_effect: write_external  # contains a publication step; it only acts under an approved, hash-bound approval
cost_class: llm_small
certification: {status: certified, evidence: tests/integration/test_e2e_local_run.py}
tags: [investigation]
spec:
  framing: true
  steps:
    - key: plan_approval
      use: agent.supervisor
      behaviour: plan_approved
      title: Wait for plan approval
      type: approval_gate
      payload: plan
      when: "run.autonomy_level <= 2"
      gates_roots: true
    - {key: context, use: agent.context, title: Load business context and resolve terminology}
    - {key: metadata, use: agent.metadata, title: Discover technical metadata of selected tables}
    - key: relationships
      use: agent.metadata
      behaviour: discover_relationships
      title: Discover and validate relationships
      after: [metadata]
      optional: true
    - {key: profile, use: agent.profiler, title: Profile selected tables, after: [metadata]}
    - key: quality
      use: agent.data_quality
      title: Detect data-quality issues
      after: [profile, relationships]
      optional: true
    - key: hypotheses
      use: agent.investigator
      title: Generate analytical questions and prioritised hypotheses
      after: [context, profile, quality]
      replan_boundary: [{trigger: redirect, reset: self_and_downstream}]
      expands:
        - {prefix: "test:", use: agent.data_scientist}
        - {prefix: "followups:", use: agent.investigator, behaviour: follow_ups}
    - key: insights
      use: agent.insight
      title: Turn supported results into evidence-backed findings
      after: [hypotheses, "test:*", "followups:*"]
    - key: verify
      use: agent.critic
      title: REV verification of every finding
      after: [insights]
      replan_boundary: [{trigger: finding_rejected, reset: downstream}]
    - {key: dataset, use: agent.sql, title: Build the reusable analytical dataset, after: [verify]}
    - {key: semantic, use: agent.semantic, title: Define and validate KPIs, after: [dataset]}
    - {key: visualize, use: agent.visualization, title: Design charts and executive + operational dashboards, after: [semantic]}
    - key: publish_request
      use: agent.publisher
      title: Governance review and publication approval request
      type: approval_gate
      payload: bundle
      approval_for: publish
      after: [visualize]
      skip_when: {if: "run.origin.publish == 'skip'", reason: publication not requested for this run}
    - key: publish
      use: agent.publisher
      behaviour: publish
      title: Publish approved bundle to the BI destination
      type: side_effect
      after: [publish_request]
      optional: true
      skip_when: {if: "run.origin.publish == 'skip'", reason: publication not requested for this run}
    - key: finalize
      use: agent.supervisor
      title: Consolidate results, write episode memory and lineage graph
      after: [visualize, publish]
