notes: >
  Validation is offline: every $ref between these files resolves through a local `referencing` registry
  keyed by each file's $id, so nothing is fetched at runtime. The OpenLineage core schema leaves facet
  bodies open (additionalProperties), so each facet an event carries is also validated against its own
  pinned facet schema, looked up by the facet's `_schemaURL`; a facet whose schema is not pinned here is
  reported, never silently accepted. Re-check these pins when ODCS or OpenLineage publish a new version.
